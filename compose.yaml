name: mc714-t2

x-node-base: &node-base
  build:
    context: .
    dockerfile: Dockerfile
    target: app-node
  image: mc714-t2-node:latest
  restart: unless-stopped
  networks:
    - cluster
  healthcheck:
    test: ["CMD", "/node", "-healthcheck"]
    interval: 5s
    timeout: 3s
    retries: 5
    start_period: 10s

services:
  node0:
    <<: *node-base
    container_name: mc714-node0
    hostname: node0
    environment:
      NODE_ID: "0"
      LISTEN_ADDR: ":8000"
      HTTP_ADDR: ":8080"
      PEERS: "0=node0:8000,1=node1:8000,2=node2:8000"
      HEARTBEAT_INTERVAL_MS: "200"
      HEARTBEAT_TIMEOUT_MS: "800"
      ELECTION_TIMEOUT_MS: "600"
      TX_TIMEOUT_MS: "1500"
      WAL_DIR: "/data/wal"
      FAULT_SEED: "42"
      NET_DELAY_MS: "0"
      NET_JITTER_MS: "0"
      NET_DROP_RATE: "0.0"
    volumes:
      - wal0:/data/wal
    ports:
      - "8080:8080"

  node1:
    <<: *node-base
    container_name: mc714-node1
    hostname: node1
    environment:
      NODE_ID: "1"
      LISTEN_ADDR: ":8000"
      HTTP_ADDR: ":8080"
      PEERS: "0=node0:8000,1=node1:8000,2=node2:8000"
      HEARTBEAT_INTERVAL_MS: "200"
      HEARTBEAT_TIMEOUT_MS: "800"
      ELECTION_TIMEOUT_MS: "600"
      TX_TIMEOUT_MS: "1500"
      WAL_DIR: "/data/wal"
      FAULT_SEED: "42"
      NET_DELAY_MS: "0"
      NET_JITTER_MS: "0"
      NET_DROP_RATE: "0.0"
    volumes:
      - wal1:/data/wal
    ports:
      - "8081:8080"

  node2:
    <<: *node-base
    container_name: mc714-node2
    hostname: node2
    environment:
      NODE_ID: "2"
      LISTEN_ADDR: ":8000"
      HTTP_ADDR: ":8080"
      PEERS: "0=node0:8000,1=node1:8000,2=node2:8000"
      HEARTBEAT_INTERVAL_MS: "200"
      HEARTBEAT_TIMEOUT_MS: "800"
      ELECTION_TIMEOUT_MS: "600"
      TX_TIMEOUT_MS: "1500"
      WAL_DIR: "/data/wal"
      FAULT_SEED: "42"
      NET_DELAY_MS: "0"
      NET_JITTER_MS: "0"
      NET_DROP_RATE: "0.0"
    volumes:
      - wal2:/data/wal
    ports:
      - "8082:8080"

volumes:
  wal0:
  wal1:
  wal2:

networks:
  cluster:
    driver: bridge
