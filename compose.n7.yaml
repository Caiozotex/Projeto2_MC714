# Override para experimento de 7 nós.
# Uso: docker compose -f compose.yaml -f compose.n7.yaml up -d --build
#
# Cada serviço declara `image:` (a imagem já foi construída pelo base) em vez de
# `build:` — override não recompila. node5/node6 são declarados aqui.

services:
  node0:
    environment:
      PEERS: "0=node0:8000,1=node1:8000,2=node2:8000,3=node3:8000,4=node4:8000,5=node5:8000,6=node6:8000"
  node1:
    environment:
      PEERS: "0=node0:8000,1=node1:8000,2=node2:8000,3=node3:8000,4=node4:8000,5=node5:8000,6=node6:8000"
  node2:
    environment:
      PEERS: "0=node0:8000,1=node1:8000,2=node2:8000,3=node3:8000,4=node4:8000,5=node5:8000,6=node6:8000"

  node3:
    image: mc714-t2-node:latest
    container_name: mc714-node3
    hostname: node3
    restart: unless-stopped
    networks: [cluster]
    healthcheck:
      test: ["CMD", "/node", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      NODE_ID: "3"
      LISTEN_ADDR: ":8000"
      HTTP_ADDR: ":8080"
      PEERS: "0=node0:8000,1=node1:8000,2=node2:8000,3=node3:8000,4=node4:8000,5=node5:8000,6=node6:8000"
      HEARTBEAT_INTERVAL_MS: "200"
      HEARTBEAT_TIMEOUT_MS: "800"
      ELECTION_TIMEOUT_MS: "600"
      TX_TIMEOUT_MS: "1500"
      WAL_DIR: "/data/wal"
      FAULT_SEED: "42"
      NET_DELAY_MS: "0"
      NET_JITTER_MS: "0"
      NET_DROP_RATE: "0.0"
    volumes: [wal3:/data/wal]
    ports: ["8083:8080"]

  node4:
    image: mc714-t2-node:latest
    container_name: mc714-node4
    hostname: node4
    restart: unless-stopped
    networks: [cluster]
    healthcheck:
      test: ["CMD", "/node", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      NODE_ID: "4"
      LISTEN_ADDR: ":8000"
      HTTP_ADDR: ":8080"
      PEERS: "0=node0:8000,1=node1:8000,2=node2:8000,3=node3:8000,4=node4:8000,5=node5:8000,6=node6:8000"
      HEARTBEAT_INTERVAL_MS: "200"
      HEARTBEAT_TIMEOUT_MS: "800"
      ELECTION_TIMEOUT_MS: "600"
      TX_TIMEOUT_MS: "1500"
      WAL_DIR: "/data/wal"
      FAULT_SEED: "42"
      NET_DELAY_MS: "0"
      NET_JITTER_MS: "0"
      NET_DROP_RATE: "0.0"
    volumes: [wal4:/data/wal]
    ports: ["8084:8080"]

  node5:
    image: mc714-t2-node:latest
    container_name: mc714-node5
    hostname: node5
    restart: unless-stopped
    networks: [cluster]
    healthcheck:
      test: ["CMD", "/node", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      NODE_ID: "5"
      LISTEN_ADDR: ":8000"
      HTTP_ADDR: ":8080"
      PEERS: "0=node0:8000,1=node1:8000,2=node2:8000,3=node3:8000,4=node4:8000,5=node5:8000,6=node6:8000"
      HEARTBEAT_INTERVAL_MS: "200"
      HEARTBEAT_TIMEOUT_MS: "800"
      ELECTION_TIMEOUT_MS: "600"
      TX_TIMEOUT_MS: "1500"
      WAL_DIR: "/data/wal"
      FAULT_SEED: "42"
      NET_DELAY_MS: "0"
      NET_JITTER_MS: "0"
      NET_DROP_RATE: "0.0"
    volumes: [wal5:/data/wal]
    ports: ["8085:8080"]

  node6:
    image: mc714-t2-node:latest
    container_name: mc714-node6
    hostname: node6
    restart: unless-stopped
    networks: [cluster]
    healthcheck:
      test: ["CMD", "/node", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      NODE_ID: "6"
      LISTEN_ADDR: ":8000"
      HTTP_ADDR: ":8080"
      PEERS: "0=node0:8000,1=node1:8000,2=node2:8000,3=node3:8000,4=node4:8000,5=node5:8000,6=node6:8000"
      HEARTBEAT_INTERVAL_MS: "200"
      HEARTBEAT_TIMEOUT_MS: "800"
